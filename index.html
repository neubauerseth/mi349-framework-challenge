<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Premier League — Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Premier League demo header + tables (Bootstrap)">

</head>
<body class="bg-light text-body">

    <!-- Header / Nav -->
    <header class="site-header">
        <nav class="navbar navbar-expand-lg navbar-light container py-3">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="assets/premier-league-logo-transparent.png" alt="Premier League" height="48">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-3">
                    <li class="nav-item"><a class="nav-link" href="#">Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Table</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Statistics</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Fantasy</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">News</a></li>
                </ul>
            </div>
        </nav>
    </header>

    
    

    <main class="container my-5">

        <div id="game_field">
            <div id='goal'>
                <div class='hitbox' box="0"></div>
                <div class='hitbox' box="1"></div>
                <div class='hitbox' box="2"></div>
                <div class='hitbox' box="3"></div>
                <div class='hitbox' box="4"></div>
            </div>

            <!-- Add the SVG for animation path -->
            <svg viewBox="0 0 10 10" id="svg" xmlns="http://www.w3.org/2000/svg">
                <path id="path" d="M 10 10 C 20 20, 40 20, 50 10" stroke="rgba(0,0,0,0)" fill="transparent"/>
                
                <circle id='circle' r="5" fill="rgba(255,0,0,0)">
                    <animateMotion
                        id="bally"
                        dur="1s"
                        repeatCount="1"
                        begin="goal.click"
                        fill="freeze"
                        path="M20,50 C20,-50 180,150 180,50 C180-50 20,150 20,50 z" />
                </circle>
            </svg>

        </div>

        <!-- 404 block with soccer ball replacing the 0 (single #ball element will be moved into the field for animation) -->
        <section class="text-center my-5">
            <h1 class="error-404 display-1 fw-bold mb-3">
                4
                <span id="ball" class="ball-inline" role="img" aria-label="soccer ball" title="soccer ball"></span>
                4
            </h1>
            <p class="lead text-muted">Page not found</p>
            <p class="lead text-muted">But feel free to kick around!</p>
        </section>
    </main>

    <footer class="site-footer text-white py-5">
        <div class="container">
            <div class="row align-items-start">
                <div class="col-md-4 mb-3 d-flex align-items-start">
                    <img src="assets/premier-league-logo-transparent.png" alt="Premier League" height="48" class="me-3">
                    <div class="ms-2">
                        <h6 class="text-uppercase small mb-3">Premier League</h6>
                    </div>
                </div>

                <div class="col-md-4 mb-3">
                    <h6 class="text-uppercase small mb-3">Quick links</h6>
                    <ul class="list-unstyled">
                        <li><a class="footer-link" href="#">Matches</a></li>
                        <li><a class="footer-link" href="#">Table</a></li>
                        <li><a class="footer-link" href="#">Statistics</a></li>
                        <li><a class="footer-link" href="#">Fantasy</a></li>
                    </ul>
                </div>

                <div class="col-md-4 mb-3">
                    <h6 class="text-uppercase small mb-3">Contact</h6>
                </div>
            </div>

            
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
